name: Deploy اسان حساب (main)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build deployable artifact

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Package artifact
        run: |
          mkdir -p dist
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/framework/cache/data' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='storage/logs' \
            --exclude='.env' \
            --exclude='dist' \
            --exclude='database/database.sqlite' \
            ./ dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-release
          path: dist/
          retention-days: 14

      # The deploy steps below run only when the Hostinger repository secrets
      # (HOSTINGER_SSH_HOST, HOSTINGER_SSH_USER, HOSTINGER_SSH_KEY,
      # HOSTINGER_APP_PATH) are configured; otherwise the workflow just
      # produces the downloadable artifact. See deploy/HOSTINGER_DEPLOY.md
      # for the manual equivalent of these steps.
      - name: Check whether Hostinger deploy secrets are configured
        id: cfg
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          if [ -n "$HOSTINGER_SSH_HOST" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Hostinger secrets not set - skipping live deploy, artifact only."
          fi

      # The route to this server is not always up. A single SSH timeout used
      # to throw away the whole release: the build succeeded, the artifact
      # was fine, and the shop kept running the previous version with nobody
      # told why. rsync is incremental, so a retry resumes rather than
      # restarts — each attempt costs a connection, not a re-upload.
      #
      # Repeated as three guarded steps because a `uses:` step cannot be
      # wrapped in a shell retry loop.
      - name: Deploy to Hostinger via rsync over SSH
        id: rsync1
        if: steps.cfg.outputs.deploy == 'true'
        continue-on-error: true
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # Never delete server-side state: .env, storage (logos, logs,
          # sessions), the sqlite file, and cached bootstrap files stay.
          switches: >-
            -avz --delete
            --exclude=.env
            --exclude=storage/
            --exclude=bootstrap/cache/
            --exclude=database/database.sqlite
          path: dist/
          remote_path: ${{ secrets.HOSTINGER_APP_PATH }}
          remote_host: ${{ secrets.HOSTINGER_SSH_HOST }}
          # Hostinger shared/Business SSH listens on 65002, not 22.
          remote_port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          remote_user: ${{ secrets.HOSTINGER_SSH_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Retry rsync deploy (attempt 2)
        id: rsync2
        if: steps.cfg.outputs.deploy == 'true' && steps.rsync1.outcome == 'failure'
        continue-on-error: true
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avz --delete
            --exclude=.env
            --exclude=storage/
            --exclude=bootstrap/cache/
            --exclude=database/database.sqlite
          path: dist/
          remote_path: ${{ secrets.HOSTINGER_APP_PATH }}
          remote_host: ${{ secrets.HOSTINGER_SSH_HOST }}
          remote_port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          remote_user: ${{ secrets.HOSTINGER_SSH_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      # The last attempt is not tolerant: if the server cannot be reached
      # three times running, the deploy has genuinely failed and saying so
      # is the only honest outcome.
      - name: Retry rsync deploy (attempt 3)
        if: steps.cfg.outputs.deploy == 'true' && steps.rsync2.outcome == 'failure'
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: >-
            -avz --delete
            --exclude=.env
            --exclude=storage/
            --exclude=bootstrap/cache/
            --exclude=database/database.sqlite
          path: dist/
          remote_path: ${{ secrets.HOSTINGER_APP_PATH }}
          remote_host: ${{ secrets.HOSTINGER_SSH_HOST }}
          remote_port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          remote_user: ${{ secrets.HOSTINGER_SSH_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      # The script itself ships with the code and is idempotent, so a second
      # attempt after a dropped connection repeats work rather than breaking
      # it — the same position the next deploy would leave the server in.
      - name: Run remote migrations, seeders, and cache rebuild
        id: release1
        if: steps.cfg.outputs.deploy == 'true'
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            export APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"
            export PHP_BIN="${{ secrets.HOSTINGER_PHP_BIN }}"
            bash "$APP_PATH/deploy/remote-release.sh"

      - name: Retry remote release (attempt 2)
        if: steps.cfg.outputs.deploy == 'true' && steps.release1.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            export APP_PATH="${{ secrets.HOSTINGER_APP_PATH }}"
            export PHP_BIN="${{ secrets.HOSTINGER_PHP_BIN }}"
            bash "$APP_PATH/deploy/remote-release.sh"
